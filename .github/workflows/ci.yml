name: CI

on:
  push:
    branches: [main]
  pull_request:

# O job só lê o repositório; não devolve nada e não precisa de mais que isso.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 é o piso anunciado no README; 3.14 é onde se desenvolve.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      # Sem .env no runner: o conftest define AEGIS_* antes de importar a aplicação.
      - run: python -m pytest -q
